sources:
  - url: https://developer.phorest.com/docs/getting-started
    type: Documentation
    note: Base auth scheme, EU/US server selection, REST/form-encoded/JSON description, explicit "webhooks not supported, use polling" statement.
  - url: https://developer.phorest.com/docs/frequently-asked-questions
    type: Documentation
    note: Confirms transactionId is unique per branch only and not present in SQS purchase messages; no WebSocket mentioned.
  - url: https://developer.phorest.com/docs/using-the-client-endpoint
    type: Documentation
    note: Confirmed base URL https://platform.phorest.com/third-party-api-server/api/business and Client create/update semantics.
  - url: https://support.phorest.com/hc/en-us/articles/4411932479250-How-to-call-on-the-API-Endpoints
    type: Documentation
    note: Confirmed region-specific base URLs (EU/US-AUS/DEV) and URL structure businessId/branch/branchId/endpoint.
  - url: https://developer.phorest.com/reference/getappointments
    type: APIReference
    note: All documented endpoints are HTTPS REST; confirms 100 rps rate limit and pagination pattern.
  - url: https://developer.phorest.com/docs/common-api-use-cases
    type: Documentation
    note: Describes Booking, Client, Product, Purchase, Voucher, CSV Export, and Review API use cases; no realtime transport mentioned.
  - url: https://github.com/phorest/sqs-sample
    type: SourceCode
    note: Public reference project showing purchase events optionally delivered to a partner-owned AWS SQS queue; not a Phorest-hosted realtime endpoint and not WebSocket.
  - url: https://support.phorest.com/hc/en-us/articles/360018547979-Integrating-3rd-Party-E-Commerce-Solutions
    type: Documentation
    note: Product and Purchase API used for third-party e-commerce integration; REST only.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists, and Phorest's own public API is
    entirely request/response REST plus a documented polling pattern for
    change detection. No AsyncAPI document was created because there is no
    server-push transport on Phorest's own hosted API to model; the one
    asynchronous mechanism (SQS purchase events) is delivered into
    infrastructure the integrating partner owns and configures, not a
    Phorest-hosted channel.
