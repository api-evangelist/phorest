aid: phorest
url: https://raw.githubusercontent.com/api-evangelist/phorest/refs/heads/main/apis.yml
name: Phorest
kind: company
description: Phorest is salon and spa business management software (scheduling, point
  of sale, client marketing, online booking, and reporting) used by hair, beauty,
  and med-spa businesses across the UK, Ireland, mainland Europe, North America,
  and Australia. Partner-gated access is granted to the Phorest API (also called
  Phorest Connect by some partners) on request - a REST, basic-authenticated API
  scoped per business and branch that exposes clients, appointments/bookings,
  staff, services, products, purchases, vouchers, and reporting data so approved
  developers can build custom booking flows, e-commerce integrations, call-centre
  lookups, and reporting tools on top of a salon's Phorest data.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Salon Software
- Spa Software
- Scheduling
- Point of Sale
- Business Management
- Vertical SaaS
created: '2026-07-03'
modified: '2026-07-03'
specificationVersion: '0.19'
apis:
- aid: phorest:phorest-clients-api
  name: Phorest Clients API
  tags:
  - Clients
  - CRM
  - Client Categories
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.phorest.com/reference/getclients
  baseURL: https://api-gateway-eu.phorest.com/third-party-api-server/api/business
  properties:
  - url: https://developer.phorest.com/docs/using-the-client-endpoint
    type: Documentation
  - url: https://developer.phorest.com/reference/getclients
    type: APIReference
  - url: openapi/phorest-openapi.yml
    type: OpenAPI
  description: Create, retrieve, update, and list clients (individually or in batch)
    scoped to a business, including filtering by email, phone, name, or update
    time, plus client categories used for newsletter and marketing segmentation.
    Confirmed against Phorest's public API reference.
- aid: phorest:phorest-appointments-bookings-api
  name: Phorest Appointments & Bookings API
  tags:
  - Appointments
  - Bookings
  - Scheduling
  - Availability
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.phorest.com/reference/getappointments
  baseURL: https://api-gateway-eu.phorest.com/third-party-api-server/api/business
  properties:
  - url: https://developer.phorest.com/docs/common-api-use-cases
    type: Documentation
  - url: https://developer.phorest.com/reference/getappointments
    type: APIReference
  - url: https://developer.phorest.com/docs/list-of-errors-seen-on-appointments-bookings-endpoints
    type: Documentation
  - url: openapi/phorest-openapi.yml
    type: OpenAPI
  description: List, retrieve, update, cancel, confirm, and check in appointments
    for a business branch; create, cancel, activate, and note bookings; and check
    real-time appointment-slot availability for a set of requested services. The
    backbone of Phorest's bespoke online-booking use case. Confirmed against
    Phorest's public API reference.
- aid: phorest:phorest-staff-api
  name: Phorest Staff API
  tags:
  - Staff
  - Rota
  - Breaks
  - Work Time Tables
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.phorest.com/reference/getstafflist
  baseURL: https://api-gateway-eu.phorest.com/third-party-api-server/api/business
  properties:
  - url: https://developer.phorest.com/reference/getstafflist
    type: APIReference
  - url: https://developer.phorest.com/reference/getstaffworktimetables
    type: APIReference
  - url: openapi/phorest-openapi.yml
    type: OpenAPI
  description: List and retrieve staff (individually or in batch) per branch,
    read staff work time tables (rota), and create, retrieve, update, and delete
    staff breaks. Confirmed against Phorest's public API reference; the staff
    work time tables endpoint does not support pagination and always returns
    the full date-range result set.
- aid: phorest:phorest-services-api
  name: Phorest Services API
  tags:
  - Services
  - Service Categories
  - Packages
  - Special Offers
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.phorest.com/reference/getservices_1
  baseURL: https://api-gateway-eu.phorest.com/third-party-api-server/api/business
  properties:
  - url: https://developer.phorest.com/reference/getservices_1
    type: APIReference
  - url: https://developer.phorest.com/reference/getservicecategories
    type: APIReference
  - url: openapi/phorest-openapi.yml
    type: OpenAPI
  description: List services, service categories, service packages, and service
    special offers for a branch, including price and duration data used to
    build booking flows and quotes. Confirmed against Phorest's public API
    reference.
- aid: phorest:phorest-products-purchases-api
  name: Phorest Products & Purchases API
  tags:
  - Products
  - Retail
  - Purchases
  - Point of Sale
  - Inventory
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.phorest.com/reference/createpurchase
  baseURL: https://api-gateway-eu.phorest.com/third-party-api-server/api/business
  properties:
  - url: https://support.phorest.com/hc/en-us/articles/360018547979-Integrating-3rd-Party-E-Commerce-Solutions
    type: Documentation
  - url: https://developer.phorest.com/reference/createpurchase
    type: APIReference
  - url: https://developer.phorest.com/reference/getproducts
    type: APIReference
  - url: openapi/phorest-openapi.yml
    type: OpenAPI
  description: List retail products with stock level, pricing, and barcode data;
    record purchases (appointments, products, courses, or vouchers) against a
    client and branch, which updates stock automatically; read inventory
    transactions and till balances; and perform manual stock adjustments. Used
    for third-party e-commerce (WooCommerce/Shopify-style) integrations.
    Confirmed against Phorest's public API reference. Purchase creation also
    emits an event onto a partner-provisioned AWS SQS queue per Phorest's
    sqs-sample reference project.
- aid: phorest:phorest-vouchers-loyalty-api
  name: Phorest Vouchers & Loyalty API
  tags:
  - Vouchers
  - Gift Cards
  - Loyalty
  - Rewards
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.phorest.com/reference/getvouchers
  baseURL: https://api-gateway-eu.phorest.com/third-party-api-server/api/business
  properties:
  - url: https://developer.phorest.com/docs/common-api-use-cases
    type: Documentation
  - url: https://developer.phorest.com/reference/getvouchers
    type: APIReference
  - url: https://developer.phorest.com/reference/createvoucher
    type: APIReference
  - url: openapi/phorest-openapi.yml
    type: OpenAPI
  description: Create, retrieve, list, and update the balance of gift vouchers
    scoped to a business, and adjust a client's loyalty points balance. Phorest
    does not process the voucher purchase payment itself - integrators build
    the purchase web experience and payment step, then write the voucher via
    this API. Confirmed against Phorest's public API reference.
- aid: phorest:phorest-branches-api
  name: Phorest Branches API
  tags:
  - Branches
  - Locations
  - Rooms
  - Machines
  - Tax Rates
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.phorest.com/reference/getbranches
  baseURL: https://api-gateway-eu.phorest.com/third-party-api-server/api/business
  properties:
  - url: https://developer.phorest.com/reference/getbranches
    type: APIReference
  - url: https://developer.phorest.com/reference/getbranchworktimetable
    type: APIReference
  - url: openapi/phorest-openapi.yml
    type: OpenAPI
  description: List a business's branches (locations), each branch's work time
    table, treatment rooms, equipment/machines, and tax rates - the reference
    data most other Phorest endpoints are scoped underneath. Confirmed against
    Phorest's public API reference.
- aid: phorest:phorest-reporting-reviews-api
  name: Phorest Reporting & Reviews API
  tags:
  - Reporting
  - CSV Export
  - Reviews
  - Leads
  - Sale Fees
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.phorest.com/reference/createcsvexportjob
  baseURL: https://api-gateway-eu.phorest.com/third-party-api-server/api/business
  properties:
  - url: https://developer.phorest.com/docs/common-api-use-cases
    type: Documentation
  - url: https://developer.phorest.com/reference/createcsvexportjob
    type: APIReference
  - url: https://developer.phorest.com/reference/getreviewlist
    type: APIReference
  - url: openapi/phorest-openapi.yml
    type: OpenAPI
  description: Create and poll asynchronous CSV export jobs for raw sale-level
    reporting over a date range, list and retrieve client reviews for
    syndication to external review platforms, list sales-fee records, and read
    marketing leads and lead statistics. Confirmed against Phorest's public API
    reference.
