- id: phorest-api-access
  name: Phorest API Access (Partner-Gated)
  type: addon
  description: >-
    Access to the Phorest third-party API is requested through Phorest
    support and layered on top of an existing subscription; there is no
    separate published API subscription fee for the salon. Third-party
    software vendors seeking a certified partner integration may be subject
    to a separate integration charge from Phorest.
  entries:
  - label: API Access
    name: api_access
    type: flat
    metric: account
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: included with an existing Phorest subscription; partner integration fees are negotiated separately
    userMultiplied: false
  elements:
  - name: Basic-Authenticated REST Access
  - name: Client, Appointment, Staff, Service, Product, Purchase, Voucher Data
- id: phorest-online-booking-fee
  name: Online Booking Per-Booking Fee
  type: usage
  description: >-
    A small per-booking fee applied to bookings made through Phorest Online
    Booking, separate from the monthly subscription.
  entries:
  - label: Per Online Booking
    name: online_booking_fee
    type: usage
    metric: bookings
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: "~$1 USD/CAD, ~$1.25 AUD, ~GBP 0.60-1.50 depending on region and booking value"
    userMultiplied: false
  elements:
  - name: Online Booking Widget
