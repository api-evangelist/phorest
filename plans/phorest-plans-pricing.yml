  - name: Two-Way SMS
  - name: Memberships
  - name: Highest Free SMS Allowance
- id: phorest-medspa
  name: Core Aesthetics / Elevate Aesthetics (MedSpa)
  type: paid
  description: >-
    Parallel two-tier MedSpa product line, mirroring the salon/spa Starter-to-Elite
    progression but tailored to injectables/aesthetics workflows.
  entries:
  - label: Monthly Subscription
    name: medspa_subscription
    type: flat
    metric: business
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: custom quote
    userMultiplied: false
